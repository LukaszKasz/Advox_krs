name: advox_krs

services:
  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: advox-krs-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: advox_krs_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - advox-krs-network

  # FastAPI Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: advox-krs-backend
    working_dir: /workspace/Advox_krs/backend
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/advox_krs_db
      SECRET_KEY: your-secret-key-change-in-production-please
    ports:
      - "8001:8000"
    volumes:
      - .:/workspace/Advox_krs
    depends_on:
      db:
        condition: service_healthy
    networks:
      - advox-krs-network
    restart: unless-stopped

  # React Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: advox-krs-frontend
    ports:
      - "3001:80"
    volumes:
      - .:/workspace/Advox_krs:ro
    depends_on:
      - backend
    networks:
      - advox-krs-network
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local

networks:
  advox-krs-network:
    driver: bridge
